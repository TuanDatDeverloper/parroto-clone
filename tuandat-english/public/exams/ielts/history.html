rtion":"Sentence insertion","part7_main_idea":"Main idea","part7_detail":"Detail","part7_inference":"Inference","part7_vocabulary_in_context":"Vocabulary in context","part7_sentence_insertion":"Sentence insertion","part7_reference":"Reference","part7_purpose":"Purpose","part7_not_true":"Not true","topic_business":"Business","topic_office":"Office","topic_customer_service":"Customer service","topic_travel":"Travel","topic_shopping":"Shopping","topic_dining":"Dining","topic_health":"Health","topic_technology":"Technology","topic_education":"Education","topic_entertainment":"Entertainment","topic_environment":"Environment","topic_transportation":"Transportation","topic_finance":"Finance","topic_housing":"Housing","topic_employment":"Employment"},"comments":{"title":"Comments","placeholder":"Write a comment...","reply":"Reply","replyPlaceholder":"Write a reply...","loadMoreReplies":"Load more replies","empty":"No comments yet","deleteTitle":"Delete comment","deleteDesc":"Are you sure you want to delete this comment?","deleteConfirm":"Delete"},"suggest":{"title":"Keep improving","subtitle":"🚀 89% of learners raise their TOEIC score by 100+ points within 4 weeks of daily vocabulary and listening practice. Keep your streak going!","vocabTitle":"TOEIC vocabulary","listenTitle":"TOEIC listening practice","seeAll":"See all","cardsCount":"{{count}} words","vocabCta":"Study TOEIC vocabulary","listenCta":"Practice TOEIC listening","ieltsSubtitle":"🚀 Reach your target IELTS band faster with daily vocabulary and listening practice. Keep your streak going!","ieltsVocabTitle":"IELTS vocabulary","ieltsListenTitle":"IELTS listening practice","ieltsVocabCta":"Study IELTS vocabulary","ieltsListenCta":"Practice IELTS listening"},"examSeo":{"toeic":{"introTitle":"Practise for the TOEIC online","introBody":"A mock test is the fastest way to find out what TOEIC score you are sitting on and which Part is holding you back. TuanDat has free TOEIC mock tests that mirror the real format - 200 questions, 120 minutes, scored on the official 10-990 scale - with answer explanations. Take a timed full test, or drill a single Part.","structureTitle":"TOEIC test structure (Listening \u0026 Reading)","colSection":"Section","colPart":"Part","colContent":"Content","colCount":"Questions","sectionListening":"Listening (~45 min)","sectionReading":"Reading (75 min)","totalLabel":"Total","totalValue":"200 questions / 120 minutes","part1":"Photographs","part2":"Question-Response","part3":"Conversations","part4":"Short talks","part5":"Incomplete sentences","part6":"Text completion","part7":"Reading comprehension","scoringTitle":"How TOEIC is scored","scoringBody":"Listening and Reading are each scored from 5 to 495, for a total of 10-990. There is no fixed pass mark; your raw score is converted to the scaled score using an official conversion table.","colScore":"Score","colMeaning":"What it means","band1":"Basic workplace communication; the graduation bar at many universities","band2":"Enough for most jobs that ask for English","band3":"Proficient; an advantage when applying to international employers","band4":"Advanced, close to the ceiling","tipsTitle":"How to prepare for the TOEIC","tip1Title":"Manage your time in Reading","tip1Body":"Part 7 is long and it is where most people run out of time. Practise skimming and scanning, and budget time per passage instead of reading every word from the top.","tip2Title":"Drill Listening Parts 3-4 daily","tip2Body":"These two carry the most questions in the Listening section. Dictation practice trains you to keep up with the speed of real conversations and talks.","tip3Title":"Learn vocabulary by workplace topic","tip3Body":"The TOEIC lives in an office world: emails, contracts, schedules, orders. Revising vocabulary by those topics makes it far quicker to infer meaning under time pressure.","tip4Title":"Take timed mock tests regularly","tip4Body":"Sit a timed mock test on a regular cadence to track your score and get used to real time pressure.","faqTitle":"Frequently asked questions","faq1q":"How many questions is the TOEIC, and how long does it take?","faq1a":"The TOEIC Listening \u0026 Reading test is 200 questions in 120 minutes - 100 Listening questions (about 45 minutes) and 100 Reading questions (75 minutes).","faq2q":"What is a good TOEIC score?","faq2a":"The scale runs 10-990. It depends on your goal: around 600 covers basic workplace needs, 750+ is solid, 850+ is strong.","faq3q":"Is an online TOEIC mock test like the real thing?","faq3a":"Yes. The mock tests follow the real format across all 7 Parts, with a timer and scoring on the official 10-990 scale.","faq4q":"Where should I start with TOEIC prep?","faq4a":"Sit one mock test to find your current level, then attack your weakest Part first, alongside daily listening and vocabulary practice.","faq5q":"How long does it take to gain 100 TOEIC points?","faq5a":"It depends on your starting point and intensity, but 1-3 months of daily practice is typical. Regular dictation and mock tests speed it up.","relatedTitle":"Study next","relatedVocab":"TOEIC vocabulary - 600 essential words","relatedDictation":"Listening practice with dictation","relatedCross":"IELTS practice"},"ielts":{"introTitle":"Practise for IELTS online","introBody":"IELTS is scored band 0 to 9 per skill. On TuanDat you can practise two of them - Listening and Reading - in the real exam format, with band scoring and answer explanations. They are also the two skills that respond fastest to steady practice.","structureTitle":"IELTS test structure","structureCaption":"This is the structure of the real IELTS exam, for the full picture.","colSkill":"Skill","colTime":"Time","colContent":"Content","skillListening":"Listening","skillReading":"Reading","skillWriting":"Writing","skillSpeaking":"Speaking","timeListening":"~30 min (+10 min transfer)","timeReading":"60 min","timeWriting":"60 min","timeSpeaking":"11-14 min","contentListening":"40 questions, 4 sections","contentReading":"40 questions (Academic or General)","contentWriting":"2 tasks","contentSpeaking":"One-to-one interview, 3 parts","scopeTitle":"What you can practise on TuanDat","scopeBody":"TuanDat focuses on \u003cb\u003eListening and Reading\u003c/b\u003e - real exam format, band scoring from 1.0 to 9.0, and explanations for every answer. We do not mark Writing or Speaking. You can still build speaking fluency with shadowing and listening accuracy with dictation here.","scoringTitle":"The IELTS band scale","scoringBody":"Each skill is scored from band 0 to 9. Your Overall band is the average of the four skills, rounded to the nearest 0.5 - 6.25 rounds to 6.5, for example.","colBand":"Band","colLevel":"Level","band1":"Intermediate; communicates basically but with errors","band2":"Meets the entry bar at many universities","band3":"Good; meets most academic and immigration requirements","band4":"Very good, close to fully proficient","typesTitle":"Academic or General Training?","typesBody":"Academic is for university study and professional registration; General Training is for migration and work. Listening and Speaking are identical in both; Reading and Writing differ.","tipsTitle":"How to prepare for IELTS","tip1Title":"Listening: practise with dictation","tip1Body":"Daily dictation trains you for native speed and for catching the exact keywords, numbers and names that IELTS Listening targets.","tip2Title":"Speaking: practise with shadowing","tip2Body":"Shadowing builds fluency and intonation and cuts hesitation. Even though TuanDat does not mark Speaking, it is still an effective way to train the reflex.","tip3Title":"Learn academic vocabulary by topic","tip3Body":"Revise the topics that keep coming up: environment, education, technology, health. Band 6.5+ leans heavily on academic vocabulary range.","tip4Title":"Sit timed mock tests","tip4Body":"Work to the real clock so you get used to the pressure and can see which skill to fix first.","faqTitle":"Frequently asked questions","faq1q":"What sections does IELTS have?","faq1a":"IELTS has four skills: Listening, Reading, Writing and Speaking. Listening and Speaking are the same in both Academic and General. On TuanDat you can practise Listening and Reading.","faq2q":"How is the IELTS band score calculated?","faq2a":"Each skill is scored from band 0 to 9. The Overall band is the average of the four skills, rounded to the nearest 0.5 (6.25 rounds to 6.5).","faq3q":"What is the difference between IELTS Academic and General Training?","faq3a":"They differ in Reading and Writing; Listening and Speaking are the same. Academic is for university study, General Training for migration and work.","faq4q":"How do I practise IELTS Listening effectively?","faq4a":"Do dictation daily to get used to the speed and to catch keywords, and sit timed mock tests to build the reflex.","faq5q":"How long does it take to gain 0.5-1.0 band?","faq5a":"Usually 1-3 months with steady, well-directed practice - especially if you focus on your weakest skill and train listening and speaking every day.","relatedTitle":"Study next","relatedVocab":"Basic IELTS vocabulary - 600 words","relatedDictation":"Listening practice with dictation","relatedShadowing":"Speaking practice with shadowing","relatedCross":"TOEIC practice"}}}}},"initialLocale":"en","userConfig":{"i18n":{"defaultLocale":"en","locales":["en","ar","de","el","es","id","ja","ko","ms","pt","ru","th","tr","uk","vi","zh-CN","zh-TW"],"localeDetection":true,"localePath":"/vercel/path0/public/locales"},"reloadOnPrerender":false,"fallbackLng":"en","debug":false,"default":{"i18n":{"defaultLocale":"en","locales":["en","ar","de","el","es","id","ja","ko","ms","pt","ru","th","tr","uk","vi","zh-CN","zh-TW"],"localeDetection":true,"localePath":"/vercel/path0/public/locales"},"reloadOnPrerender":false,"fallbackLng":"en","debug":false}}}},"__N_SSG":true},"page":"/exams/ielts/history","query":{},"buildId":"5yvq-OgoPecVqxR6LR8-B","isFallback":false,"gsp":true,"locale":"en","locales":[
