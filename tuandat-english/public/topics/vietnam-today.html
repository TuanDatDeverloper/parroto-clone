zu vietnamesischen Themen mit unseren Shadowing- und Diktat-Tools. Beginne jetzt mit dem Entdecken!","_id":"68c0f4f57316b286cb755192"},"el":{"page_title":"Ανακαλύψτε το Βιετνάμ \u0026 Μάθετε Αγγλικά με το κανάλι 'Vietnam Today'","page_description":"Αποκτήστε μια βαθύτερη κατανόηση της ζωής, του πολιτισμού και των ειδήσεων στο Βιετνάμ μέσω του καναλιού 'Vietnam Today'. Βελτιώστε την ακουστική σας κατανόηση στα αγγλικά και το λεξιλόγιό σας σε βιετναμέζικα θέματα με τα εργαλεία Shadowing και Υπαγόρευσης. Ξεκινήστε την εξερεύνηση τώρα!","_id":"68c0f4f57316b286cb755193"},"en":{"page_title":"Discover Vietnam \u0026 Learn English with the 'Vietnam Today' Channel","page_description":"Gain a deeper understanding of life, culture, and news in Vietnam through the 'Vietnam Today' channel. Improve your English listening skills and vocabulary on Vietnamese topics with our Shadowing and Dictation tools. Start exploring now!","_id":"68c0f4f57316b286cb755194"},"es":{"page_title":"Descubre Vietnam y Aprende Inglés con el canal 'Vietnam Today'","page_description":"Obtén una comprensión más profunda de la vida, la cultura y las noticias de Vietnam a través del canal 'Vietnam Today'. Mejora tu escucha en inglés y tu vocabulario sobre temas vietnamitas con nuestras herramientas de Shadowing y Dictado. ¡Empieza a explorar ahora!","_id":"68c0f4f57316b286cb755195"},"id":{"page_title":"Temukan Vietnam \u0026 Belajar Bahasa Inggris dengan Channel 'Vietnam Today'","page_description":"Dapatkan pemahaman lebih dalam tentang kehidupan, budaya, dan berita di Vietnam melalui channel 'Vietnam Today'. Tingkatkan keterampilan mendengarkan dan kosakata bahasa Inggris Anda tentang topik Vietnam dengan alat Shadowing dan Dikte kami. Mulai jelajahi sekarang!","_id":"68c0f4f57316b286cb755196"},"ja":{"page_title":"「Vietnam Today」チャンネルでベトナムを発見し、英語を学ぼう","page_description":"「Vietnam Today」チャンネルを通じて、ベトナムの生活、文化、ニュースをより深く理解しましょう。シャドーイングとディクテーションツールを使い、ベトナムのトピックに関する英語のリスニングスキルと語彙を向上させます。今すぐ探索を始めましょう！","_id":"68c0f4f57316b286cb755197"},"ko":{"page_title":"'Vietnam Today' 채널로 베트남을 발견하고 영어 배우기","page_description":"'Vietnam Today' 채널을 통해 베트남의 삶, 문화, 뉴스에 대해 더 깊이 이해해 보세요. 섀도잉 및 딕테이션 도구로 베트남 주제에 대한 영어 듣기 능력과 어휘력을 향상시키세요. 지금 바로 탐험을 시작하세요!","_id":"68c0f4f57316b286cb755198"},"ms":{"page_title":"Terokai Vietnam \u0026 Belajar Bahasa Inggeris dengan Saluran 'Vietnam Today'","page_description":"Dapatkan pemahaman yang lebih mendalam tentang kehidupan, budaya, dan berita di Vietnam melalui saluran 'Vietnam Today'. Tingkatkan kemahiran mendengar dan perbendaharaan kata Bahasa Inggeris anda mengenai topik Vietnam dengan alat Shadowing dan Imlaan kami. Mula meneroka sekarang!","_id":"68c0f4f57316b286cb755199"},"pt":{"page_title":"Descubra o Vietnã e Aprenda Inglês com o canal 'Vietnam Today'","page_description":"Obtenha uma compreensão mais profunda da vida, cultura e notícias no Vietnã através do canal 'Vietnam Today'. Melhore suas habilidades de escuta em inglês e seu vocabulário sobre tópicos vietnamitas com nossas ferramentas de Shadowing e Ditado. Comece a explorar agora!","_id":"68c0f4f57316b286cb75519a"},"ru":{"page_title":"Откройте для себя Вьетнам и учите английский с каналом 'Vietnam Today'","page_description":"Получите более глубокое представление о жизни, культуре и новостях Вьетнама через канал 'Vietnam Today'. Улучшайте свои навыки аудирования на английском и словарный запас по вьетнамским темам с нашими инструментами Shadowing и диктантов. Начните исследовать прямо сейчас!","_id":"68c0f4f57316b286cb75519b"},"th":{"page_title":"ค้นพบเวียดนามและเรียนรู้ภาษาอังกฤษกับช่อง 'Vietnam Today'","page_description":"ทำความเข้าใจชีวิต วัฒนธรรม และข่าวสารในเวียดนามอย่างลึกซึ้งยิ่งขึ้นผ่านช่อง 'Vietnam Today' พัฒนาทักษะการฟังและคำศัพท์ภาษาอังกฤษในหัวข้อเกี่ยวกับเวียดนามด้วยเครื่องมือ Shadowing และ Dictation ของเรา เริ่มการสำรวจเลย!","_id":"68c0f4f57316b286cb75519c"},"tr":{"page_title":"'Vietnam Today' Kanalı ile Vietnam'ı Keşfedin ve İngilizce Öğrenin","page_description":"'Vietnam Today' kanalı aracılığıyla Vietnam'daki yaşam, kültür ve haberler hakkında daha derin bir anlayış kazanın. Shadowing ve Dikte araçlarımızla Vietnam konularındaki İngilizce dinleme becerilerinizi ve kelime dağarcığınızı geliştirin. Şimdi keşfetmeye başlayın!","_id":"68c0f4f57316b286cb75519d"},"uk":{"page_title":"Відкрийте для себе В'єтнам та вивчайте англійську з каналом 'Vietnam Today'","page_description":"Отримайте глибше розуміння життя, культури та новин у В'єтнамі через канал 'Vietnam Today'. Покращуйте свої навички аудіювання англійською та словниковий запас на в'єтнамські теми за допомогою наших інструментів Shadowing та диктантів. Почніть досліджувати зараз!","_id":"68c0f4f57316b286cb75519e"},"vi":{"page_title":"Khám Phá Việt Nam \u0026 Luyện Nghe Tiếng Anh qua kênh Vietnam Today","page_description":"Hiểu sâu hơn về đời sống, văn hóa và tin tức tại Việt Nam qua kênh 'Vietnam Today'. Nâng cao kỹ năng nghe và vốn từ vựng tiếng Anh về các chủ đề Việt Nam với công cụ Shadowing và Dictation. Khám phá ngay!","_id":"68c0f4f57316b286cb75519f"},"zh-CN":{"page_title":"通过“今日越南”频道探索越南并学习英语","page_description":"通过“今日越南”频道，更深入地了解越南的生活、文化和新闻。使用我们的影子跟读和听写工具，提升您在越南主题上的英语听力技巧和词汇量。立即开始探索！","_id":"68c0f4f57316b286cb7551a0"},"zh-TW":{"page_title":"透過「今日越南」頻道探索越南並學習英語","page_description":"透過「今日越南」頻道，更深入地了解越南的生活、文化和新聞。使用我們的影子跟讀和聽寫工具，提升您在越南主題上的英語聽力技巧和詞彙量。立即開始探索！","_id":"68c0f4f57316b286cb7551a1"}},"_id":"68c0f4f57316b286cb755190"},"created_at":1757476085,"updated_at":1757482895,"thumbnail":"/assets/assets/categories/68c0f4f57316b286cb75518f/thumbnail-ZSyxypiP5X-kV80sY_the.webp","tag":"vietnam","total_lessons":44},"meta":{"page_title":"Discover Vietnam \u0026 Learn English with the 'Vietnam Today' Channel","page_description":"Gain a deeper understanding of life, culture, and news in Vietnam through the 'Vietnam Today' channel. Improve your English listening skills and vocabulary on Vietnamese topics with our Shadowing and Dictation tools. Start exploring now!","_id":"68c0f4f57316b286cb755194"}
